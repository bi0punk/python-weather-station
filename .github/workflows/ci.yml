name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Ruff check
        run: ruff check . --select E,F,I,B,SIM,UP --line-length 120

      - name: Smoke tests
        run: pytest -q tests/